name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cli
    env:
      GOTOOLCHAIN: local
      CAIRN_REQUIRE_BORG: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          # The scaffold has no dependencies or go.sum yet.
          cache: false
      - name: Install Borg 1.4.5
        env:
          # Digest published with the borgbackup 1.4.5 release.
          BORG_SHA256: 1410e28609be3080d0e3ab27a78f5c586a29fd0c75c2aa6415fcde1293bcd923
        run: |
          mkdir -p "$RUNNER_TEMP/borg-bin"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/borg-bin/borg" \
            https://github.com/borgbackup/borg/releases/download/1.4.5/borg-linux-glibc235-x86_64-gh
          echo "$BORG_SHA256  $RUNNER_TEMP/borg-bin/borg" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/borg-bin/borg"
          test "$("$RUNNER_TEMP/borg-bin/borg" --version)" = "borg 1.4.5"
          echo "$RUNNER_TEMP/borg-bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Staticcheck
        run: make staticcheck
      - name: Check vulnerabilities
        run: make security
      - name: Test with race detection
        run: make test
      - name: Build supported architectures
        run: make build-all
