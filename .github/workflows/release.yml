name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Extract version from release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
            echo "Expected a release tag such as v0.1.0 or v0.1.0-rc.1" >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build and verify release archives
        working-directory: cli
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          make release VERSION="$RELEASE_VERSION" OUT_DIR=dist
          ./scripts/test-release.sh dist "$RELEASE_VERSION"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "cli/dist/cairn_${RELEASE_VERSION}_linux_amd64.tar.gz" \
            "cli/dist/cairn_${RELEASE_VERSION}_linux_arm64.tar.gz" \
            cli/dist/SHA256SUMS

  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Validate image version
        id: images
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]] || (( ${#RELEASE_TAG} > 111 )); then
            echo "Expected a release tag such as v0.1.0 or v0.1.0-rc.1" >&2
            exit 1
          fi
          image="ghcr.io/${REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build images
        env:
          IMAGE: ${{ steps.images.outputs.image }}
          VERSION: ${{ steps.images.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            for variant in regular distroless; do
              docker buildx build --load --platform "linux/$arch" --target "$variant" \
                --build-arg "VERSION=$VERSION" -t "$IMAGE:verify-$variant-$arch" .
            done
          done
      - name: Verify images
        env:
          IMAGE: ${{ steps.images.outputs.image }}
          VERSION: ${{ steps.images.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            for variant in regular distroless; do
              image="$IMAGE:verify-$variant-$arch"
              actual=$(docker run --rm --platform "linux/$arch" --network none "$image" --version)
              if [[ "$actual" != "cairn $VERSION" ]]; then
                echo "Unexpected version in $image: $actual" >&2
                exit 1
              fi
              docker run --rm --platform "linux/$arch" --network none --entrypoint /usr/bin/borg "$image" --version
              docker run --rm --platform "linux/$arch" --network none --entrypoint /usr/bin/ssh "$image" -V
            done
          done
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified images and publish manifests
        env:
          IMAGE: ${{ steps.images.outputs.image }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          for variant in regular distroless; do
            for arch in amd64 arm64; do
              suffix="-$arch"
              if [[ "$variant" == distroless ]]; then suffix="-distroless$suffix"; fi
              docker tag "$IMAGE:verify-$variant-$arch" "$IMAGE:$RELEASE_TAG$suffix"
              docker push "$IMAGE:$RELEASE_TAG$suffix"
              digest=$(docker image inspect "$IMAGE:$RELEASE_TAG$suffix" --format '{{index .RepoDigests 0}}')
              echo "$digest" > "$variant-$arch.digest"
            done
          done
          docker buildx imagetools create -t "$IMAGE:$RELEASE_TAG" \
            "$(cat regular-amd64.digest)" "$(cat regular-arm64.digest)"
          docker buildx imagetools create -t "$IMAGE:$RELEASE_TAG-distroless" \
            "$(cat distroless-amd64.digest)" "$(cat distroless-arm64.digest)"
