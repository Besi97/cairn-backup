name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Extract version from release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
            echo "Expected a release tag such as v0.1.0 or v0.1.0-rc.1" >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build and verify release archives
        working-directory: cli
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          make release VERSION="$RELEASE_VERSION" OUT_DIR=dist
          ./scripts/test-release.sh dist "$RELEASE_VERSION"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "cli/dist/cairn_${RELEASE_VERSION}_linux_amd64.tar.gz" \
            "cli/dist/cairn_${RELEASE_VERSION}_linux_arm64.tar.gz" \
            cli/dist/SHA256SUMS

  images:
    name: Build and publish ${{ matrix.variant }} / ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [regular, distroless]
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Validate image version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]] || (( ${#RELEASE_TAG} > 106 )); then
            echo "Expected a release tag such as v0.1.0 or v0.1.0-rc.1" >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.platform.arch }}
          VARIANT: ${{ matrix.variant }}
        run: |
          docker build --platform "linux/$ARCH" --target "$VARIANT" \
            --build-arg "VERSION=$VERSION" -t "cairn-release:$VARIANT-$ARCH" .
      - name: Verify image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.platform.arch }}
          VARIANT: ${{ matrix.variant }}
        run: |
          image="cairn-release:$VARIANT-$ARCH"
          [[ "$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" == "linux/$ARCH" ]]
          actual=$(docker run --rm --network none "$image" --version)
          if [[ "$actual" != "cairn $VERSION" ]]; then
            echo "Unexpected version in $image: $actual" >&2
            exit 1
          fi
          docker run --rm --network none --entrypoint /usr/bin/borg "$image" --version
          docker run --rm --network none --entrypoint /usr/bin/ssh "$image" -V
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified image
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ARCH: ${{ matrix.platform.arch }}
          VARIANT: ${{ matrix.variant }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          tag="$image:arch-$RELEASE_TAG-$VARIANT-$ARCH"
          docker tag "cairn-release:$VARIANT-$ARCH" "$tag"
          docker push "$tag" | tee push.log
          mapfile -t digests < <(sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}) size: [0-9]+$/\1/p' push.log)
          if (( ${#digests[@]} != 1 )); then
            echo "Expected one digest from docker push" >&2
            exit 1
          fi
          printf '%s\n' "${digests[0]}" > digest.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.platform.arch }}
          path: digest.txt
          if-no-files-found: error
          retention-days: 1

  publish-manifests:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [regular, distroless]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: digest-${{ matrix.variant }}-*
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish manifest
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VARIANT: ${{ matrix.variant }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]] || (( ${#RELEASE_TAG} > 106 )); then
            echo "Invalid release tag" >&2
            exit 1
          fi
          image="ghcr.io/${REPOSITORY,,}"
          for arch in amd64 arm64; do
            digest=$(cat "digests/digest-$VARIANT-$arch/digest.txt")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
          tag="$RELEASE_TAG"
          if [[ "$VARIANT" == distroless ]]; then
            tag="distroless-$RELEASE_TAG"
          fi
          docker buildx imagetools create -t "$image:$tag" \
            "$image@$(cat "digests/digest-$VARIANT-amd64/digest.txt")" \
            "$image@$(cat "digests/digest-$VARIANT-arm64/digest.txt")"
