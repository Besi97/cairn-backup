name: CLI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: go mod download
      - run: make check
      - run: make cross-build
      - run: make release-check
      - name: Check module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  systemd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Test installation and service lifecycle with systemd PID 1
        run: tests/systemd/run.sh

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test container images
        run: tests/container/run.sh

  container-smoke:
    if: github.event_name == 'pull_request'
    name: Container smoke ${{ matrix.variant }} / ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [regular, distroless]
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build image
        env:
          ARCH: ${{ matrix.platform.arch }}
          VARIANT: ${{ matrix.variant }}
        run: |
          docker build --platform "linux/$ARCH" --target "$VARIANT" \
            --build-arg VERSION=0.0.0-ci -t cairn-smoke .
      - name: Verify image
        env:
          ARCH: ${{ matrix.platform.arch }}
        run: |
          [[ "$(docker image inspect cairn-smoke --format '{{.Os}}/{{.Architecture}}')" == "linux/$ARCH" ]]
          [[ "$(docker run --rm --network none cairn-smoke --version)" == "cairn 0.0.0-ci" ]]
          docker run --rm --network none --entrypoint /usr/bin/borg cairn-smoke --version
          docker run --rm --network none --entrypoint /usr/bin/ssh cairn-smoke -V

  borg-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 1.2.8
            asset: borg-linux64
            sha256: cfa50fb704a93d3a4fa258120966345fddb394f960dca7c47fcb774d0172f40b
          - version: 1.4.5
            asset: borg-linux-glibc231-x86_64
            sha256: c8457f70660064d0f45b38283ab4cc65b342970012013201d3aec713a75898fb
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Download Borg
        env:
          BORG_VERSION: ${{ matrix.version }}
          BORG_ASSET: ${{ matrix.asset }}
          BORG_SHA256: ${{ matrix.sha256 }}
        run: |
          curl --fail --location --retry 3 "https://github.com/borgbackup/borg/releases/download/$BORG_VERSION/$BORG_ASSET" --output "$RUNNER_TEMP/borg"
          echo "$BORG_SHA256  $RUNNER_TEMP/borg" | sha256sum --check
          chmod +x "$RUNNER_TEMP/borg"
      - name: Test with real Borg
        env:
          CAIRN_TEST_BORG: ${{ runner.temp }}/borg
        run: make integration-test
