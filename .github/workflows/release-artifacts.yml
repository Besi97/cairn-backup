name: Release artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  images:
    name: Verify ${{ matrix.variant }} / ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        variant: [regular, distroless]
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate image version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]] || (( ${#RELEASE_VERSION} > 110 )); then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi
      - name: Build image
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.platform.arch }}
          VARIANT: ${{ matrix.variant }}
        run: |
          docker build --platform "linux/$ARCH" --target "$VARIANT" \
            --build-arg "VERSION=$VERSION" -t "cairn-release:$VARIANT-$ARCH" .
      - name: Verify image
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.platform.arch }}
          VARIANT: ${{ matrix.variant }}
        run: |
          image="cairn-release:$VARIANT-$ARCH"
          [[ "$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" == "linux/$ARCH" ]]
          actual=$(docker run --rm --network none "$image" --version)
          if [[ "$actual" != "cairn $VERSION" ]]; then
            echo "Unexpected version in $image: $actual" >&2
            exit 1
          fi
          docker run --rm --network none --entrypoint /usr/bin/borg "$image" --version
          docker run --rm --network none --entrypoint /usr/bin/ssh "$image" -V

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Build and verify release archives
        working-directory: cli
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          make release VERSION="$RELEASE_VERSION" OUT_DIR=dist
          ./scripts/test-release.sh dist "$RELEASE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cairn-${{ inputs.version }}
          path: cli/dist/*
          if-no-files-found: error
          retention-days: 30
