name: Release artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate image version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]] || (( ${#RELEASE_VERSION} > 116 )); then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi
      - name: Build images
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker build --platform linux/amd64 --target regular \
            --build-arg "VERSION=$VERSION" -t "cairn-release-test:v$VERSION" .
          docker build --platform linux/amd64 --target distroless \
            --build-arg "VERSION=$VERSION" -t "cairn-release-test:v$VERSION-distroless" .
      - name: Verify image versions
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for tag in "v$VERSION" "v$VERSION-distroless"; do
            actual=$(docker run --rm --network none "cairn-release-test:$tag" --version)
            if [[ "$actual" != "cairn $VERSION" ]]; then
              echo "Unexpected version in cairn-release-test:$tag: $actual" >&2
              exit 1
            fi
          done

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Build and verify release archives
        working-directory: cli
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          make release VERSION="$RELEASE_VERSION" OUT_DIR=dist
          ./scripts/test-release.sh dist "$RELEASE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cairn-${{ inputs.version }}
          path: cli/dist/*
          if-no-files-found: error
          retention-days: 30
