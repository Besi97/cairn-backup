name: Release artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate image version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]] || (( ${#RELEASE_VERSION} > 110 )); then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build images
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for arch in amd64 arm64; do
            for variant in regular distroless; do
              docker buildx build --load --platform "linux/$arch" --target "$variant" \
                --build-arg "VERSION=$VERSION" -t "cairn-release-test:$variant-$arch" .
            done
          done
      - name: Verify images
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for arch in amd64 arm64; do
            for variant in regular distroless; do
              image="cairn-release-test:$variant-$arch"
              actual=$(docker run --rm --platform "linux/$arch" --network none "$image" --version)
              if [[ "$actual" != "cairn $VERSION" ]]; then
                echo "Unexpected version in $image: $actual" >&2
                exit 1
              fi
              docker run --rm --platform "linux/$arch" --network none --entrypoint /usr/bin/borg "$image" --version
              docker run --rm --platform "linux/$arch" --network none --entrypoint /usr/bin/ssh "$image" -V
            done
          done

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Build and verify release archives
        working-directory: cli
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          make release VERSION="$RELEASE_VERSION" OUT_DIR=dist
          ./scripts/test-release.sh dist "$RELEASE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cairn-${{ inputs.version }}
          path: cli/dist/*
          if-no-files-found: error
          retention-days: 30
